
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Interview | InterviewAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <h2>Interview<span>AI</span></h2>
    <a href="/">Exit Interview</a>
</nav>

<main class="interview-container">

    <span class="tag">AI MOCK INTERVIEW</span>
    <h1>Your Interview Session</h1>

    <div class="interview-info">
        <span>Subject: {{ category }}</span>
        <span>Level: {{ difficulty }}</span>
    </div>

    <div class="question-card">
        <h3>✦ Interview Question</h3>
        <p>{{ question }}</p>
    </div>

    <form action="/submit" method="POST" id="answerForm">

        <label for="answer">Your Answer</label>

        <textarea
            name="answer"
            id="answer"
            rows="9"
            maxlength="5000"
            minlength="10"
            placeholder="Write your answer here. Explain your understanding clearly..."
            required></textarea>

        <div class="answer-info">
            <span>Write a clear and detailed answer.</span>
            <span id="charCount">0 / 5000</span>
        </div>

        <button type="submit" class="btn full-btn" id="submitBtn">
            Submit Answer & Get Feedback →
        </button>

    </form>

</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
